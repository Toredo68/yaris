<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>AGS Tarih - 50 Soru Karma</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 650px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 1s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>AGS Tarih Yarışması</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">50 Soru - 20 Saniye - Hızlı Bilen Kazanır!</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="badge" id="q-counter">Soru 1/50</span>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 2 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "ags-genel-tarih-50-v2";

const questions = [
  // --- İSLAMİYET ÖNCESİ TÜRK TARİHİ (12 Soru) ---
  { q: "Türk adının anlamını Kaşgarlı Mahmut Divanü Lugati't-Türk adlı eserinde nasıl tanımlamıştır?", options: ["Türeyen / Çoğalan", "Olgunluk Çağı", "Güçlü / Kuvvetli", "Miğfer"], answer: 1 },
  { q: "Orhun Abideleri aşağıdaki Türk devletlerinden hangisi döneminde dikilmiştir?", options: ["I. Göktürk Devleti", "Uygur Devleti", "II. Göktürk (Kutluk) Devleti", "Avar Kağanlığı"], answer: 2 },
  { q: "Maniheizm dinini kabul ederek yerleşik hayata geçen ve tapınak mimarisi geliştiren ilk Türk devleti hangisidir?", options: ["Uygurlar", "Hazarlar", "Kırgızlar", "Göktürkler"], answer: 0 },
  { q: "Avrupa Hun Devleti'nde 'Tanrının Kırbacı' olarak bilinen ve Doğu Roma'yı Margus ile Anatolios antlaşmalarına zorlayan hükümdar kimdir?", options: ["Balamir", "Uldız", "Rua", "Attila"], answer: 3 },
  { q: "İslamiyet öncesi Türk devletlerinde hükümdarın erkek çocuklarına verilen unvan hangisidir?", options: ["Tigin", "Şad", "Ataman", "İnanç"], answer: 0 },
  { q: "Musevilik dinini benimseyen ve Kafkaslar'da ticari huzur dönemi (Pax Khazarica) yaşatan Türk devleti hangisidir?", options: ["Peçenekler", "Hazarlar", "Karluklar", "Bulgarlar"], answer: 1 },
  { q: "Dünyanın en uzun destanı kabul edilen ve Kırgızlara ait olan milli destan hangisidir?", options: ["Oğuz Kağan", "Ergenekon", "Manas", "Türeyiş"], answer: 2 },
  { q: "Asya Hun Devleti'nde orduyu onluk teşkilata göre düzenleyerek günümüz modern ordularına ilham veren Türk hükümdarı kimdir?", options: ["Teoman", "Mete Han", "Ki-ok", "Çi-çi"], answer: 1 },
  { q: "İslamiyet öncesi Türk devletlerinde boy beylerinin katıldığı, devlet işlerinin görüşüldüğü meclise ne ad verilir?", options: ["Kurultay (Toy)", "Ayukı", "Yargu", "Tudun"], answer: 0 },
  { q: "Bizans ordusunda ücretli askerlik yaparken Malazgirt Savaşı'nda Büyük Selçuklu saflarına geçerek zaferde rol oynayan Türk topluluğu hangisidir?", options: ["Avarlar", "Hazarlar", "Peçenekler", "Kıpçaklar"], answer: 2 },
  { q: "Eski Türklerde ölen kişinin mezarının başına hayattayken öldürdüğü düşman sayısınca dikilen taşlara ne ad verilir?", options: ["Kurgan", "Balbal", "Yuğ", "Uçmağ"], answer: 1 },
  { q: "Türk tarihinde matbaayı, kağıt üretimini ve hareketli harf sistemini kullanan ilk Türk devleti hangisidir?", options: ["Uygurlar", "Hunlar", "Göktürkler", "Türgişler"], answer: 0 },

  // --- İLK TÜRK-İSLAM DEVLETLERİ (7 Soru) ---
  { q: "Orta Asya'da kurulan ilk Müslüman Türk devleti aşağıdakilerden hangisidir?", options: ["Tolunoğulları", "Gazneliler", "Karahanlılar", "İhşidiler"], answer: 2 },
  { q: "Sultan unvanını kullanan ilk Türk hükümdarı kimdir?", options: ["Gazneli Mahmut", "Tuğrul Bey", "Alparslan", "Satuk Buğra Han"], answer: 0 },
  { q: "Büyük Selçuklu Devleti ile Bizans arasında yapılan ve Anadolu'nun kapılarını Türklere açan 1071 tarihli zafer hangisidir?", options: ["Pasinler Savaşı", "Malazgirt Meydan Muharebesi", "Miryokefalon Savaşı", "Dandanakan Savaşı"], answer: 1 },
  { q: "Anadolu'da kurulan ilk Türk beyliklerinden Mengücekliler tarafından inşa edilen ve UNESCO Dünya Mirası listesinde yer alan şaheser hangisidir?", options: ["Divriği Ulu Camii ve Darüşşifası", "Diyarbakır Ulu Camii", "Hunat Hatun Külliyesi", "Gök Medrese"], answer: 0 },
  { q: "Anadolu Selçuklu Devleti'nin 'tüccarlara düşük gümrük tarifesi ve devlet sigortası' uygulaması hangi alana verilen önemi gösterir?", options: ["Ordu teşkilatına", "Tarım üretimine", "Uluslararası ticarete", "İlmiye sınıfına"], answer: 2 },
  { q: "Anadolu'nun kesin olarak Türk yurdu olduğunu tescilleyen II. Kılıçarslan dönemi savaşı hangisidir?", options: ["Yassıçemen Savaşı", "Miryokefalon Savaşı", "Kösedağ Savaşı", "Malazgirt Savaşı"], answer: 1 },
  { q: "Mısır'da kurulan ve Moğolların batıya doğru ilerleyişini durduran 1260 tarihli Ayn Calut Savaşı'nı kazanan Türk devleti hangisidir?", options: ["Memlükler", "Eyyubiler", "Tolunoğulları", "İhşidiler"], answer: 0 },

  // --- OSMANLI SİYASİ TARİHİ (10 Soru) ---
  { q: "Osmanlı Devleti'nin Bizans tekfurlarına karşı kazandığı ilk askeri zafer kabul edilen savaş hangisidir?", options: ["Koyunhisar (Bafeus) Savaşı", "Maltepe (Pelekanon) Savaşı", "Sırpsındığı Savaşı", "Çirmen Savaşı"], answer: 0 },
  { q: "Osmanlı Devleti'nin Rumeli'deki ilk askeri üssü ve toprağı olan kale hangisidir?", options: ["Gelibolu Kalesi", "Çimpe Kalesi", "Kilitbahir Kalesi", "Seddülbahir Kalesi"], answer: 1 },
  { q: "Yıldırım Bayezid'in Haçlı ordusunu mağlup ettiği ve kendisine Halife tarafından 'Sultan-ı İklim-i Rum' unvanı verilen savaş hangisidir?", options: ["I. Kosova Savaşı", "Varna Savaşı", "Niğbolu Savaşı", "II. Kosova Savaşı"], answer: 2 },
  { q: "Ankara Savaşı (1402) sonrası Osmanlı'da yaşanan ve devleti dağılma tehlikesiyle karşı karşıya bırakan döneme ne ad verilir?", options: ["Fetret Devri", "Lale Devri", "Tanzimat Devri", "Meşrutiyet Devri"], answer: 0 },
  { q: "Akdeniz'in bir 'Türk gölü' haline gelmesinde belirleyici olan ve Barbaros Hayrettin Paşa komutasında kazanılan deniz zaferi hangisidir?", options: ["Cerbe Deniz Savaşı", "Preveze Deniz Zaferi", "İnebahtı Savaşı", "Navarin Baskını"], answer: 1 },
  { q: "Osmanlı Devleti'nin Doğu'da en geniş sınırlara ulaştığı 1590 tarihli antlaşma hangisidir?", options: ["Kasr-ı Şirin Antlaşması", "Amasya Antlaşması", "Nasuh Paşa Antlaşması", "Ferhat Paşa Antlaşması"], answer: 3 },
  { q: "Osmanlı padişahının protokolde Avusturya kralına denk sayılmasıyla Osmanlı'nın diplomatik üstünlüğünü kaybettiği 1606 tarihli antlaşma hangisidir?", options: ["Zitvatorok Antlaşması", "İstanbul Antlaşması", "Vasvar Antlaşması", "Karlofça Antlaşması"], answer: 0 },
  { q: "Osmanlı Devleti'nin Batı'da ilk kez büyük çapta toprak kaybettiği 1699 tarihli antlaşma hangisidir?", options: ["Pasarofça Antlaşması", "Belgrad Antlaşması", "Karlofça Antlaşması", "Küçük Kaynarca Antlaşması"], answer: 2 },
  { q: "Osmanlı Devleti'nin Batı'nın üstünlüğünü ilk kez kabul ettiği ve Lale Devri'ni başlatan antlaşma hangisidir?", options: ["Pasarofça Antlaşması", "Prut Antlaşması", "Yaş Antlaşması", "Edirne Antlaşması"], answer: 0 },
  { q: "Yunanistan'ın Osmanlı Devleti'nden ayrılarak resmen bağımsızlığını kazandığı 1829 tarihli antlaşma hangisidir?", options: ["Bükreş Antlaşması", "Edirne Antlaşması", "Hünkar İskelesi Antlaşması", "Berlin Antlaşması"], answer: 1 },

  // --- OSMANLI KÜLTÜR VE MEDENİYETİ (8 Soru) ---
  { q: "Osmanlı Devleti'nde sadrazam sefere çıktığında başkentte yerine vekalet eden görevli kimdir?", options: ["Kazasker", "Nişancı", "Sadaret Kethüdası (Kaymakamı)", "Kaptan-ı Derya"], answer: 2 },
  { q: "Osmanlı ordu teşkilatında Tımarlı Sipahilerin yetiştirmekle yükümlü olduğu atlı askerlere ne ad verilir?", options: ["Cebelü", "Ulufe", "Humbaracı", "Lağımcı"], answer: 0 },
  { q: "Osmanlı Devleti'nde gelirleri hükümdar eşleri, kızları ve annelerine ayrılan arazi türü hangisidir?", options: ["Mukataa", "Paşmaklık", "Yurtluk", "Malikane"], answer: 1 },
  { q: "Mimar Sinan'ın 'çıraklık, kalfalık ve ustalık' eserleri kronolojik olarak hangi seçenekte doğru verilmiştir?", options: ["Süleymaniye - Selimiye - Şehzade", "Şehzade - Süleymaniye - Selimiye", "Selimiye - Şehzade - Süleymaniye", "Şehzade - Selimiye - Süleymaniye"], answer: 1 },
  { q: "Osmanlı'da lonca teşkilatında üretilen malların kalitesini ve tavan satış fiyatını belirleme uygulamasına ne ad verilir?", options: ["Narh sistemi", "İltizam sistemi", "Gedik sistemi", "Müsadere sistemi"], answer: 0 },
  { q: "Osmanlı Devleti'nde ilk Türkçe basılı eseri çıkaran İbrahim Müteferrika Matbaası'nda basılan ilk eser hangisidir?", options: ["Cihannüma", "Vankulu Lügati", "Tuhfetü'l-Kibar", "Tarih-i Naima"], answer: 1 },
  { q: "Osmanlı'da haksız kazanç sağlayan veya vefat eden memurların mallarına devlet adına el koyma usulü hangisidir?", options: ["Müsadere", "Gedik", "İstimalet", "İskan"], answer: 0 },
  { q: "Osmanlı minyatür sanatçılarına verilen genel unvan aşağıdakilerden hangisidir?", options: ["Hattat", "Müzehhib", "Nakkaş", "Hakkak"], answer: 2 },

  // --- MİLLİ MÜCADELE DÖNEMİ (8 Soru) ---
  { q: "Milli Mücadele'de halkı bilinçlendirmek adına 'İzmir'in işgalinin mitinglerle protesto edilmesini' isteyen ilk genelge hangisidir?", options: ["Amasya Genelgesi", "Havza Genelgesi", "Tamim-i İrade", "Alaşehir Kararları"], answer: 1 },
  { q: "'Vatanın bütünlüğü, milletin bağımsızlığı tehlikededir' kararı ilk kez nerede ilan edilmiştir?", options: ["Amasya Genelgesi", "Erzurum Kongresi", "Sivas Kongresi", "Misak-ı Milli"], answer: 0 },
  { q: "Bütün milli cemiyetlerin 'Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti' adı altında birleştirildiği kongre hangisidir?", options: ["Erzurum Kongresi", "Balıkesir Kongresi", "Sivas Kongresi", "Pozantı Kongresi"], answer: 2 },
  { q: "Ali Fuat Paşa'nın Batı Cephesi Komutanlığı'na atanmasıyla Temsil Heyeti ilk kez hangi gücünü kullanmıştır?", options: ["Yasama yetkisini", "Yürütme yetkisini", "Yargı yetkisini", "Diplomatik yetkiyi"], answer: 1 },
  { q: "İstanbul Hükümeti'nin Temsil Heyeti'nin hukuki varlığını resmen ve ilk kez tanıdığı gelişme hangisidir?", options: ["Bilecik Görüşmeleri", "Amasya Görüşmeleri", "Son Osmanlı Meclis-i Mebusanı", "Mudanya Mütarekesi"], answer: 1 },
  { q: "İtilaf Devletleri'nin Sevr Barış Antlaşması'nı TBMM'ye kabul ettirmek amacıyla başlattığı saldırıyla gerçekleşen savaş hangisidir?", options: ["I. İnönü Savaşı", "Sakarya Savaşı", "Başkomutanlık Meydan Muharebesi", "Çanakkale Savaşı"], answer: 0 },
  { q: "TBMM'yi tanıyan ilk Müslüman / doğulu devlet aşağıdakilerden hangisidir?", options: ["İran", "Mısır", "Afganistan", "Pakistan"], answer: 2 },
  { q: "İsmet İnönü komutasında kazanılan ve Mustafa Kemal'in 'Siz orada sadece düşmanı değil, milletin makus talihini de yendiniz' dediği savaş hangisidir?", options: ["I. İnönü Muharebesi", "II. İnönü Muharebesi", "Kütahya-Eskişehir Savaşları", "Büyük Taarruz"], answer: 1 },

  // --- İNKILAP TARİHİ VE ATATÜRK DÖNEMİ (5 Soru) ---
  { q: "Yeni Türk Devleti'nin ekonomi politikasının belirlendiği ve 'Misak-ı İktisadi' kararlarının alındığı toplantı hangisidir?", options: ["I. İzmir İktisat Kongresi", "Londra İktisat Konferansı", "Ankara Kalkınma Meclisi", "Sivas İktisat Kongresi"], answer: 0 },
  { q: "Medeni Kanun'un kabulüyle (1926) Türk kadınına tanınmayan hak aşağıdakilerden hangisidir?", options: ["Miras eşitliği", "Mahkemede tanıklık eşitliği", "İstediği mesleğe girebilme", "Milletvekili seçme ve seçilme hakkı"], answer: 3 },
  { q: "Cumhuriyetçilik ilkesinin yönetimde doğrudan hayata geçirildiğini gösteren en temel inkılap adımı hangisidir?", options: ["Saltanatın kaldırılması ve Cumhuriyetin ilanı", "Şapka İnkılabı", "Aşar Vergisinin kaldırılması", "Metrik sisteme geçilmesi"], answer: 0 },
  { q: "Batı sınırının güvenliğini sağlamak amacıyla Türkiye, Yunanistan, Yugoslavya ve Romanya arasında kurulan ittifak hangisidir?", options: ["Sadabat Paktı", "Balkan Antantı", "Akdeniz Paktı", "Bağdat Paktı"], answer: 1 },
  { q: "Türkiye'nin doğu sınırlarının güvenliğini sağlamak amacıyla İran, Irak ve Afganistan ile imzaladığı 1937 tarihli pakt hangisidir?", options: ["Balkan Paktı", "Sadabat Paktı", "CENTO", "Varşova Paktı"], answer: 1 }
];

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, answer: null, answerTime: 0 });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, answer: null, answerTime: 0 });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      p.answerTime = data.timeRemaining;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.answerTime = 0; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.score += (500 + (p.answerTime * 25));
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ name: p.name, score: p.score })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 2000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 2000);
  }
}

// Client Arayüzü
let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    lb.innerHTML = data.leaderboard.map((p, i) => `
      <div class="leaderboard-row">
        <span>#${i + 1} ${p.name}</span>
        <span style="color:#38bdf8;">${p.score} Puan</span>
      </div>
    `).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 50 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız kaydedildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx, timeRemaining: timeLeft };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; me.answerTime = timeLeft; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
