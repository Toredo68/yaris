<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>AGS Tarih - 100 Soru Eleyici Maraton</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .diff-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
    .diff-orta { background: #0369a1; color: #bae6fd; }
    .diff-zor { background: #b45309; color: #fef3c7; }
    .diff-eleyici { background: #be123c; color: #ffe4e6; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>AGS Tarih Maratonu (100 Soru)</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">Orta, Zor ve Eleyici Sorular | Comeback Puan Sistemi</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/100</span>
        <span class="diff-badge" id="q-diff">Orta</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 2 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "ags-tarih-100-maraton-v1";

const questions = [
  // --- İSLAMİYET ÖNCESİ TÜRK TARİHİ (40 Soru) ---
  { q: "Pazırık Kurganı'ndan çıkarılan dünyanın en eski düğümlü halısı hangi Türk topluluğuna aittir?", options: ["Hunlar", "İskitler", "Göktürkler", "Uygurlar"], answer: 0, diff: "Orta" },
  { q: "İslamiyet öncesi Türk devletlerinde hükümdarın eşi olan Hatun'un başkanlık ettiği kurultay/elçi kabul heyetine ne ad verilirdi?", options: ["Ayukı", "Terken Meclisi", "Toygun", "Yargu"], answer: 1, diff: "Zor" },
  { q: "Kafkasların Araplaşmasını engelleyerek İslam ordularıyla Belencer Savaşı'nı yapan Türk devleti hangisidir?", options: ["Hazarlar", "Avarlar", "Karluklar", "Türgişler"], answer: 0, diff: "Orta" },
  { q: "Emevilerle Haristan Savaşı'nı yaparak İslamiyet'in Orta Asya'da yayılmasını bir süre geciktiren Türgiş hükümdarı kimdir?", options: ["Baga Tarkan", "Sulu Kağan", "Uçelik Kağan", "Mukan Kağan"], answer: 1, diff: "Zor" },
  { q: "Eski Türklerde devlet hazinesinden ve mali işlerden sorumlu görevliye ne ad verilirdi?", options: ["Tudun", "Ağılığ (Ağıcı)", "Bitikçi", "Yabgu"], answer: 1, diff: "Eleyici" },
  { q: "Uygur Devleti'nde Maniheizm tapınaklarına verilen özel isim aşağıdakilerden hangisidir?", options: ["Stupa", "Balbal", "Bark", "Kurgan"], answer: 0, diff: "Zor" },
  { q: "Bizans kaynaklarında 'Kuman', Rus yıllıklarında ise 'Polovtsı' adıyla anılan Türk boyu hangisidir?", options: ["Kıpçaklar", "Peçenekler", "Oğuzlar", "Uzlar"], answer: 0, diff: "Orta" },
  { q: "Göktürk Devleti'nde vergi memuru ve sivil yönetici olarak görev yapan idareci hangisidir?", options: ["Tudun", "Tarkan", "Apa", "Yargıcı"], answer: 0, diff: "Orta" },
  { q: "İslamiyet öncesinde saray muhafızlarına ve hükümdarın koruma birliğine ne ad verilirdi?", options: ["Böri", "Cebelü", "Alp", "Yelme"], answer: 0, diff: "Eleyici" },
  { q: "Hazar Devleti'nde Müslüman tebaanın davalarına bakan özel yargıca ne ad verilirdi?", options: ["Kadı-i Leşker", "Gadı", "Muhtesip", "Yarguçı"], answer: 1, diff: "Eleyici" },
  { q: "Oğuz Kağan Destanı'nda Mete Han'ın seferleri ve Türk boylarına ad verişi hangi hükümdarla özdeşleştirilir?", options: ["Teoman", "Mete Han", "Bumin Kağan", "Attila"], answer: 1, diff: "Orta" },
  { q: "İslamiyet öncesinde ordunun keşif ve istihbarat amaçlı öncü birliğine ne ad verilirdi?", options: ["Yelme", "Böri", "Tarkan", "Eşkinci"], answer: 0, diff: "Zor" },
  { q: "Altın Elbiseli Adam zırhının bulunduğu ve İskit/Hun kültürüne ait olduğu kabul edilen kurgan hangisidir?", options: ["Esik Kurganı", "Pazırık Kurganı", "Noin-Ula Kurganı", "Şibe Kurganı"], answer: 0, diff: "Orta" },
  { q: "Tuna Bulgarlarında Hristiyanlığı resmi din olarak kabul eden ve 'Çar' unvanını ilk kullanan hükümdar kimdir?", options: ["Boris Han", "Kurum Han", "Omurtag Han", "Simeon"], answer: 0, diff: "Zor" },
  { q: "İslamiyet öncesinde hükümdar çocuklarının (Tigin) eğitiminden sorumlu eğitmenlere ne ad verilirdi?", options: ["Ataman (İnal)", "Lala", "Atabey", "Subaşı"], answer: 0, diff: "Orta" },
  { q: "Kutluk Devleti'nin kurucusu Kutluk Kağan'a 'İlteriş' unvanını veren danışman ve vezir kimdir?", options: ["Tonyukuk", "Kül Tigin", "Yolluğ Tigin", "Baga Tarkan"], answer: 0, diff: "Orta" },
  { q: "Kendi adına alfabe oluşturan Türk toplulukları aşağıdakilerden hangisinde birlikte verilmiştir?", options: ["Göktürk - Uygur", "Hun - Avar", "Hazar - Kıpçak", "Uygur - Kırgız"], answer: 0, diff: "Orta" },
  { q: "İslamiyet öncesi Türk ordusunda savaşta düşmanı şaşırtmak için kullanılan ıslıklı okun mucidi kimdir?", options: ["Mete Han", "Bumin Kağan", "Attila", "Teoman"], answer: 0, diff: "Orta" },
  { q: "Eski Türklerde göçebe hayat tarzında çadırların etrafında oluşturulan korunaklı konaklama yerine ne denirdi?", options: ["Yurt", "Ordu (Orda)", "Kermen", "Balık"], answer: 1, diff: "Eleyici" },
  { q: "Orhun Abideleri'nde yazıtları taşlara kazıyan ve metinlerin yazarı olan ilk Türk edibi kimdir?", options: ["Yolluğ Tigin", "Tonyukuk", "Bilge Kağan", "Kül Tigin"], answer: 0, diff: "Orta" },
  { q: "İtil Bulgarlarını ziyaret ederek onların İslamiyet'i kabul edişini 'Rihle' adlı seyahatnamesinde anlatan Arap seyyah kimdir?", options: ["İbn Fadlan", "İbn Batuta", "El-Mesudi", "El-Biruni"], answer: 0, diff: "Zor" },
  { q: "Kıpçakların Ruslarla yaptığı mücadeleleri anlatan ünlü Rus milli destanı hangisidir?", options: ["İgor Destanı", "Nibelungen", "Şehname", "Gılgamış"], answer: 0, diff: "Orta" },
  { q: "Kıpçak Türkçesi, Farsça ve Latince sözlük niteliğinde olan ünlü dil yadigarı hangisidir?", options: ["Codex Cumanicus", "Dîvânü Lugâti't-Türk", "Kutadgu Bilig", "Muhakemetü'l-Lugateyn"], answer: 0, diff: "Orta" },
  { q: "Sasanilerle ittifak kurarak Akhunlar (Eftalitler) devletine son veren Göktürk hükümdarı/yabgusu kimdir?", options: ["İstemi Yabgu", "Bumin Kağan", "Mukan Kağan", "Tardu"], answer: 0, diff: "Zor" },
  { q: "Karluk, Yağma, Çiğil ve Tuhsi boylarının birleşmesiyle temeli atılan Türk-İslam devleti hangisidir?", options: ["Karahanlılar", "Gazneliler", "Büyük Selçuklu", "Harzemşahlar"], answer: 0, diff: "Orta" },
  { q: "Macarların Hristiyanlığı seçerek Türklük özelliklerini kaybetmesinde etkili olan liderleri kimdir?", options: ["Arpad", "Körsan", "Almış", "Attila"], answer: 0, diff: "Eleyici" },
  { q: "Eski Türklerde 'Köl İç Çor' ve 'Ongin' yazıtları hangi döneme ait anıtlardır?", options: ["II. Göktürk Dönemi", "Uygur Dönemi", "Hun Dönemi", "Kırgız Dönemi"], answer: 0, diff: "Eleyici" },
  { q: "Uygur Devleti'nin başkenti olan ve 'Ordu-Balık' olarak bilinen şehir hangisidir?", options: ["Karabalgasun", "Ötüken", "Balasagun", "Kaşgar"], answer: 0, diff: "Orta" },
  { q: "Göktürklerde Batı kanadını yöneten ve 'Yabgu' unvanı taşıyan hanedan üyesinin sembolik merkezi neresiydi?", options: ["Akdağ (Tanrı Dağları)", "Ötüken", "Yayık", "İdil"], answer: 0, diff: "Eleyici" },
  { q: "İslamiyet öncesi Türklerde 'Yargu' adı verilen yüksek mahkemenin başında kim bulunurdu?", options: ["Hükümdar (Kağan)", "Ayguçı", "Tarkan", "Tudun"], answer: 0, diff: "Zor" },
  { q: "Avar Kağanlığı'na son vererek Orta Avrupa'daki varlıklarını bitiren devlet hangisidir?", options: ["Frank İmparatorluğu", "Doğu Roma", "Sasaniler", "Göktürkler"], answer: 0, diff: "Zor" },
  { q: "Kırgızların başkenti ve Türklerin kutlu vatan saydığı ormanlık merkez neresidir?", options: ["Ötüken", "Talas", "Buhara", "Semerkant"], answer: 0, diff: "Orta" },
  { q: "Eski Türk inanışında ölümden sonra ruhun kuş olup uçtuğuna inanılan cennet kavramı hangisidir?", options: ["Uçmağ", "Tamu", "Balbal", "Kam"], answer: 0, diff: "Orta" },
  { q: "İslamiyet öncesinde din adamlarına (şamanlara) verilen adlar hangisinde tam verilmiştir?", options: ["Kam - Baksı", "Toygun - Ayguçı", "Tudun - Şad", "Apa - Tarkan"], answer: 0, diff: "Orta" },
  { q: "Göktürk Devleti'nin en parlak dönemini yaşatan hükümdar kimdir?", options: ["Mukan Kağan", "Bumin Kağan", "Bilge Kağan", "İstemi Yabgu"], answer: 0, diff: "Orta" },
  { q: "Uygurlarda duvar resimlerine (fresk) verilen geleneksel ad hangisidir?", options: ["Bediz", "Balbal", "Bark", "Bitik"], answer: 0, diff: "Zor" },
  { q: "Türk tarihinde ilk kez kütüphane kuran ve minyatür sanatının ilk örneklerini veren devlet hangisidir?", options: ["Uygurlar", "Göktürkler", "Hunlar", "Karluklar"], answer: 0, diff: "Orta" },
  { q: "İskitlerin en önemli hükümdarı olan ve Firdevsi'nin Şehname'sinde 'Afrasyab' adıyla geçen komutan kimdir?", options: ["Alp Er Tunga", "Tomris Hatun", "Mete Han", "Balamir"], answer: 0, diff: "Orta" },
  { q: "Oğuzların Müslüman olanlarına 'Türkmen', Hristiyan olanlarına ise ne ad verilmiştir?", options: ["Uz", "Kuman", "Peçenek", "Avar"], answer: 0, diff: "Orta" },
  { q: "Eski Türklerde hükümdarın tahta çıkışında halkın huzurunda yapılan tahta geçme ritüeline ne ad verilirdi?", options: ["Keçe Üzerinde Kaldırma", "Kılıç Kuşanma", "Cülus Töreni", "Hutbe Okutma"], answer: 0, diff: "Eleyici" },

  // --- İLK TÜRK-İSLAM DEVLETLERİ (15 Soru) ---
  { q: "Karahanlılar Devleti'nde hükümdar çocuklarına ders veren hocalara ne unvan verilirdi?", options: ["Atabey", "Lala", "Ata (Hoca)", "İnal"], answer: 2, diff: "Eleyici" },
  { q: "Büyük Selçuklu Devleti'nde devlet güvenliğini sağlayan, gizli haber alma ve istihbarat teşkilatı hangisidir?", options: ["Divan-ı Berid", "Divan-ı İşraf", "Divan-ı İnşa", "Divan-ı Arz"], answer: 0, diff: "Zor" },
  { q: "Türk-İslam devletlerinde sınır boylarında kurulan, hem askeri savunma hem kervansaray görevi gören korunaklı yapılara ne denir?", options: ["Ribat", "Kümbet", "Tekke", "Külliye"], answer: 0, diff: "Orta" },
  { q: "Kudüs'ü 1187 Hıttin Savaşı ile Haçlılardan geri alan ünlü İslam hükümdarı kimdir?", options: ["Selahaddin Eyyubi", "Nureddin Zengi", "Baybars", "Kutuz"], answer: 0, diff: "Orta" },
  { q: "Anadolu Selçuklularında donanma komutanına verilen unvan hangisidir?", options: ["Melikü's-Sevahil (Reisü'l-Bahr)", "Kaptan-ı Derya", "Emir-i Ahur", "Subaşı"], answer: 0, diff: "Zor" },
  { q: "Büyük Selçuklularda mali teftiş yapan ve devlet kurumlarını denetleyen divan hangisidir?", options: ["Divan-ı İşraf", "Divan-ı İstifa", "Divan-ı Arz", "Divan-ı Mezalim"], answer: 0, diff: "Orta" },
  { q: "Anadolu Selçuklu Devleti'nin ilk altın parasını bastıran hükümdar kimdir?", options: ["II. Kılıçarslan", "I. Mesut", "I. Alaeddin Keykubad", "I. Gıyaseddin Keyhüsrev"], answer: 0, diff: "Zor" },
  { q: "Harzemşahlar Devleti'nin Moğollarla yaşadığı ve büyük yıkıma yol açan diplomatik kriz hangisidir?", options: ["Otrar Faciası", "Katvan Savaşı", "Yassıçemen Savaşı", "Ayn Calut"], answer: 0, diff: "Orta" },
  { q: "Anadolu Selçuklu Devleti'nin en parlak dönemini yaşadığı ve Alanya'yı fetheden hükümdar kimdir?", options: ["I. Alaeddin Keykubad", "II. Kılıçarslan", "I. İzzettin Keykavus", "Süleyman Şah"], answer: 0, diff: "Orta" },
  { q: "Mısır'da kurulan ve hükümdarlarının Türk kökenli olması sebebiyle 'Devletü't-Türkiyye' adıyla anılan devlet hangisidir?", options: ["Memlükler", "Tolunoğulları", "İhşidiler", "Eyyubiler"], answer: 0, diff: "Orta" },
  { q: "Karatay Medresesi ve İnce Minareli Medrese hangi Anadolu Selçuklu başkentinde inşa edilmiştir?", options: ["Konya", "Sivas", "Kayseri", "İznik"], answer: 0, diff: "Orta" },
  { q: "Gazneli Mahmut'un Hindistan'a yaptığı 17 seferin en ünlüsü olan ve Şiva tapınağının zenginliklerini aldığı sefer hangisidir?", options: ["Somnat Seferi", "Gucerat Seferi", "Pencap Seferi", "Delhi Seferi"], answer: 0, diff: "Zor" },
  { q: "Büyük Selçuklu Devleti'nde ordu komutanı ve askeri işlerden sorumlu vezirlik divanı hangisidir?", options: ["Divan-ı Arz (Ceyş)", "Divan-ı Tuğra", "Divan-ı İstifa", "Divan-ı Mezalim"], answer: 0, diff: "Orta" },
  { q: "Anadolu'da Moğol istilası sonrası kurulan Karesioğulları Beyliği'nin merkezi neresidir?", options: ["Balıkesir - Çanakkale", "Kütahya", "Manisa", "Muğla"], answer: 0, diff: "Orta" },
  { q: "Moğol İmparatorluğu'nun parçalanmasıyla Karadeniz'in kuzeyinde kurulan ve İslamiyet'i kabul eden Türk-Moğol devleti hangisidir?", options: ["Altın Orda Devleti", "İlhanlılar", "Çağatay Hanlığı", "Timur Devleti"], answer: 0, diff: "Zor" },

  // --- OSMANLI SİYASİ TARİHİ (15 Soru) ---
  { q: "Osmanlı Devleti'nde tahtı kendi isteğiyle oğluna bırakan ve daha sonra Varna Savaşı için tekrar tahta geçen padişah kimdir?", options: ["II. Murad", "I. Murad", "Çelebi Mehmed", "II. Bayezid"], answer: 0, diff: "Orta" },
  { q: "Fatih Sultan Mehmet'in Karadeniz'i Türk gölü yapma hedefi doğrultusunda 1461'de fethettiği Rum devleti hangisidir?", options: ["Trabzon Rum İmparatorluğu", "Mora Despotluğu", "Sinop İsfendiyaroğulları", "Kefe Kolonisi"], answer: 0, diff: "Orta" },
  { q: "Cem Sultan Olayı sebebiyle Osmanlı Devleti'nin Batı fetihlerinin duraksadığı ve iç meselenin dış krize dönüştüğü dönem hangi padişah dönemidir?", options: ["II. Bayezid", "Yavuz Sultan Selim", "Fatih Sultan Mehmet", "Kanuni"], answer: 0, diff: "Orta" },
  { q: "Safevi Devleti ile yapılan ve Doğu Anadolu'nun emniyetini kesinleştiren 1514 tarihli zafer hangisidir?", options: ["Çaldıran Savaşı", "Mercidabık", "Ridaniye", "Otlukbeli"], answer: 0, diff: "Orta" },
  { q: "Kanuni Sultan Süleyman'ın bizzat başında bulunduğu son sefer hangisidir?", options: ["Zigetvar Seferi", "Mohaç Seferi", "Rodos Seferi", "Alman Seferi"], answer: 0, diff: "Orta" },
  { q: "Osmanlı Devleti'nin Akdeniz'de fethettiği ve Doğu Akdeniz ticaret yolunu güvenceye aldığı ada 1571'de hangisi olmuştur?", options: ["Kıbrıs", "Girit", "Rodos", "Sakız"], answer: 0, diff: "Orta" },
  { q: "1596 Haçova Meydan Muharebesi'ni kazanarak 'Eğri Fatihi' unvanını alan padişah kimdir?", options: ["III. Mehmed", "III. Murad", "I. Ahmed", "II. Osman"], answer: 0, diff: "Zor" },
  { q: "Genç Osman'ın (II. Osman) Yeniçeri Ocağı'nı kaldırma fikrini ilk kez edindiği sefer hangisidir?", options: ["Hotin Seferi", "Revan Seferi", "Bağdat Seferi", "Uyvar Seferi"], answer: 0, diff: "Orta" },

// Seçenekleri otomatik karıştıralım ki her sorunun cevabı hep A olmasın
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  // Fisher-Yates shuffle
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, streak: 0, answer: null, answerTime: 0 });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, streak: 0, answer: null, answerTime: 0 });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      p.answerTime = data.timeRemaining;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.answerTime = 0; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    diff: q.diff
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;

  // En yüksek puanı tespit et (Comeback mekanizması için)
  const currentLeaderScore = Math.max(...players.map(p => p.score), 0);

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.streak += 1;
      
      // Taban Puan: 300 + Kalan Süre x 20 (Hız)
      let gained = 300 + (p.answerTime * 20);

      // Streak Bonusu (+50, +100 maks)
      if (p.streak >= 3) gained += 100;
      else if (p.streak === 2) gained += 50;

      // COMEBACK MEKANİZMASI:
      // Liderden 800 puandan fazla gerideyse doğru bildiğinde %30 ekstra puan kazanır!
      const deficit = currentLeaderScore - p.score;
      if (deficit >= 1500) {
        gained = Math.round(gained * 1.4); // %40 comeback bonusu
      } else if (deficit >= 800) {
        gained = Math.round(gained * 1.25); // %25 comeback bonusu
      }

      p.score += gained;
    } else {
      p.streak = 0; // Yanlışta seri sıfırlanır
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ name: p.name, score: p.score, streak: p.streak })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 2000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 2000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    // Zorluk rozeti
    const diffBadge = document.getElementById('q-diff');
    diffBadge.innerText = data.diff;
    diffBadge.className = `diff-badge diff-${data.diff.toLowerCase()}`;

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    lb.innerHTML = data.leaderboard.map((p, i) => `
      <div class="leaderboard-row">
        <span>#${i + 1} ${p.name} ${p.streak >= 2 ? '🔥' + p.streak : ''}</span>
        <span style="color:#38bdf8;">${p.score} Puan</span>
      </div>
    `).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 100 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx, timeRemaining: timeLeft };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; me.answerTime = timeLeft; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
